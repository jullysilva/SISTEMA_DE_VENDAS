
services:
  laravelapp:
    container_name: laravelapp
    image: acer/laravelapp
    build: ./BACKEND
    ports:
      - "8000:8000"
    volumes:
      - ./BACKEND:/var/www/html
      - /var/www/html/vendor # preserva as dependências instaladas na imagem
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload # sem --no-reload o serve descarta as variáveis abaixo
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres

  frontend:
    container_name: frontend
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./FRONTEND:/app
      - /app/node_modules # evita conflito com node_modules do host
    depends_on:
      - laravelapp

  db:
    container_name: db
    image: postgres:12
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
